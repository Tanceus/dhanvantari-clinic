[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect / rewrite rules live in public/_redirects (copied into dist).
# Do NOT add a catch-all /* → /index.html 200 here — that re-opens the
# "any URL serves the staff app" bug. Known routes + /r/* 404 + catch-all
# 404 are defined explicitly in _redirects.
